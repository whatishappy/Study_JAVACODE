server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    # 8.0 驱动类路径已变更，旧类已废弃
    driver-class-name: com.mysql.jdbc.Driver
    # 新增 allowPublicKeyRetrieval=true 解决8.0认证公钥获取问题，时区建议改为上海避免时差问题
    url: jdbc:mysql://192.168.10.101:3307/test?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
  redis:
    host: 192.168.10.101
    port: 6379
    password: 123456
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug